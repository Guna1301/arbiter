upstream arbiter_backend {
    least_conn;
    server 127.0.0.1:4001;
    server 127.0.0.1:4002;
    server 127.0.0.1:4003;
}
limit_req_zone $binary_remote_addr zone=decide_limit:10m rate=50r/s;
server {
    listen 80;

    location /decide {
        limit_req zone=decide_limit burst=100 nodelay;

        proxy_pass http://arbiter_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://arbiter_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}